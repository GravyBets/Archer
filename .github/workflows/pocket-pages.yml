name: Archer Pocket Static Site — Verified Publish
on:
  # The owner already approved public static GitHub Pages hosting. Only
  # changes to the explicitly public Pocket shell and its own tests trigger
  # an automatic redeploy. No desktop state or private backend is uploaded.
  push:
    branches: [main]
    paths:
      - 'web/archer-pocket/**'
      - '.github/workflows/pocket-pages.yml'
      - 'tests/ValidateArcherPocket.py'
      - 'tests/PocketDeviceKeysChecks.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: archer-pocket-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Test and deploy public Archer Pocket static assets
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static SPA/PWA boundaries before publishing
        run: |
          python3 tests/ValidateArcherPocket.py
          node --check web/archer-pocket/app.js
          node --check web/archer-pocket/device-keys.js
          node tests/PocketDeviceKeysChecks.mjs
          node --check web/archer-pocket/config.js
          node --check web/archer-pocket/sw.js
      - name: Upload only the public Archer Pocket UI folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/archer-pocket
      - name: Deploy validated public static Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
