name: Archer Pocket Static Site — Verified Publish
on:
  # Public static assets only; never desktop state, API secrets or phone tokens.
  push:
    branches: [main]
    paths:
      - 'web/archer-pocket/**'
      - '.github/workflows/pocket-pages.yml'
      - 'tests/ValidateArcherPocket.py'
      - 'tests/PocketDeviceKeysChecks.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archer-pocket-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and upload public Pocket static shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public SPA/PWA boundaries before artifact upload
        run: |
          python3 tests/ValidateArcherPocket.py
          node --check web/archer-pocket/app.js
          node --check web/archer-pocket/device-keys.js
          node tests/PocketDeviceKeysChecks.mjs
          node --check web/archer-pocket/config.js
          node --check web/archer-pocket/sw.js
      - name: Upload only the public Archer Pocket UI folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/archer-pocket

  deploy:
    name: Publish uploaded, validated static Pocket artifact
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Separate jobs ensure the upload has finished before the Pages API
      # looks for the named artifact. No rebuild or secret data access here.
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
