name: Archer isolated runtime smoke
on:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'Archer.MissionControl/Services/Sandbox*.cs'
      - 'Archer.MissionControl/Services/ProjectSandboxRunner.cs'
      - 'tests/DevelopmentBatchChecks/**'
      - '.github/workflows/sandbox-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    name: Rootless Podman fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check hosted runner runtime
        run: |
          command -v podman
          podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupsVersion}}'
          test "$(podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupsVersion}}')" = "true v2"
      - name: Build trusted synthetic fixture without pulling an image
        run: |
          cc -static -O2 sandbox/fixture/verify.c -o sandbox/fixture/verify
          podman build --pull=never --network=none -t localhost/archer-verifier-fixture sandbox/fixture
          id="$(podman image inspect --format '{{.Id}}' localhost/archer-verifier-fixture)"
          echo "ARCHER_SANDBOX_SMOKE_IMAGE=sha256:${id#sha256:}" >> "$GITHUB_ENV"
      - name: Exercise real isolated runtime through Archer runner
        run: dotnet run --project tests/DevelopmentBatchChecks/DevelopmentBatchChecks.csproj --configuration Release
