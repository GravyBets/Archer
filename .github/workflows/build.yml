name: Archer Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Archer.MissionControl/Archer.MissionControl.csproj
      - name: Build
        run: dotnet build Archer.MissionControl/Archer.MissionControl.csproj --configuration Release --no-restore
      - name: Validate automatic GeoShift source selection
        run: dotnet run --project tests/GeoShiftSourceSelectionChecks/GeoShiftSourceSelectionChecks.csproj --configuration Release
      - name: Verify development queue, repair caps, recovery and exact-head CI
        run: dotnet run --project tests/DevelopmentBatchChecks/DevelopmentBatchChecks.csproj --configuration Release
      - name: Restore standalone mobile gateway
        run: dotnet restore Archer.MobileGateway/Archer.MobileGateway.csproj
      - name: Build standalone mobile gateway
        run: dotnet build Archer.MobileGateway/Archer.MobileGateway.csproj --configuration Release --no-restore
      - name: Build and exercise private companion gateway
        run: |
          dotnet build Archer.PrivateGateway/Archer.PrivateGateway.csproj -c Release
          dotnet run --project tests/PrivateGatewayChecks/PrivateGatewayChecks.csproj -c Release
          bash -n deploy/linux/publish.sh
      - name: Build isolated remote gateway contract skeleton
        run: dotnet build Archer.RemoteGateway/Archer.RemoteGateway.csproj --configuration Release
      - name: Check fail-closed HTTPS ingress preflight
        run: python3 tests/ValidateRemoteIngress.py
      - name: Validate natural concise Archer chat and persisted conversation context
        run: dotnet run --project tests/ArcherConversationFlowChecks/ArcherConversationFlowChecks.csproj --configuration Release
      - name: Validate native desktop voice heartbeat (no microphone or AI)
        run: dotnet run --project tests/DesktopVoiceStatusChecks/DesktopVoiceStatusChecks.csproj --configuration Release
      - name: Run synthetic owner/device authorization contract checks
        run: dotnet run --project tests/RemoteGatewayPolicyChecks/RemoteGatewayPolicyChecks.csproj --configuration Release
      - name: Smoke-test remote gateway fail-closed localhost boundaries
        run: python3 tests/SmokeRemoteGateway.py
      - name: Verify signed synthetic JWT identities and authorization isolation
        run: python3 tests/SmokeRemoteSignedIdentity.py
      - name: Verify offline P-256 owner-approved device pairing and revocation
        run: dotnet run --project tests/RemoteDevicePairingChecks/RemoteDevicePairingChecks.csproj --configuration Release
      - name: Verify owner-bound phone proof, separate approval and durable revocation
        run: dotnet run --project tests/RemoteEnrollmentPipelineChecks/RemoteEnrollmentPipelineChecks.csproj --configuration Release
      - name: Verify fail-closed local pairing settings
        run: dotnet run --project tests/RemoteLocalPairingSettingsChecks/RemoteLocalPairingSettingsChecks.csproj --configuration Release
      - name: Smoke-test localhost Auth0 owner pairing API (no real credentials)
        run: python3 tests/SmokeLocalPairingRoutes.py
      - name: Test encrypted, owner-scoped private mailbox and integrity failures
        run: dotnet run --project tests/RemoteEncryptedMailboxChecks/RemoteEncryptedMailboxChecks.csproj --configuration Release
      - name: Smoke-test authenticated, device-gated localhost message read API
        run: python3 tests/SmokeLocalMailboxRoutes.py
      - name: Verify enrolled phone read request signature, anti-replay and revocation
        run: dotnet run --project tests/RemoteDeviceReadProofChecks/RemoteDeviceReadProofChecks.csproj --configuration Release
      - name: Simulate Pocket pairing through encrypted read and device revocation
        run: dotnet run --project tests/PocketEndToEndChecks/PocketEndToEndChecks.csproj --configuration Release
      - name: Validate persisted device enrollment, owner isolation and atomic revocation
        run: dotnet run --project tests/RemoteDeviceRegistryChecks/RemoteDeviceRegistryChecks.csproj --configuration Release
      - name: Ensure signed JWT authorization tracks live SQLite revocation across restarts
        run: python3 tests/SmokeRemotePersistentAuth.py
      - name: Validate pinned OIDC provider configuration fails closed
        run: dotnet run --project tests/RemoteOidcSettingsChecks/RemoteOidcSettingsChecks.csproj --configuration Release
      - name: Smoke-test independent OIDC local validation probe and unsafe settings
        run: python3 tests/SmokeRemoteOidcBoundary.py
      - name: Test Auth0 tenant client audience and namespaced device claim preflight
        run: dotnet run --project tests/RemoteAuth0ProfileChecks/RemoteAuth0ProfileChecks.csproj --configuration Release
      - name: Smoke-test Auth0 local-only validation profile and conflicting identity refusal
        run: python3 tests/SmokeRemoteAuth0Boundary.py
      - name: Test owner-only Auth0 local identity issuer/client/subject trust settings
        run: dotnet run --project tests/RemoteAuth0OwnerSignInChecks/RemoteAuth0OwnerSignInChecks.csproj --configuration Release
      - name: Reject crossed Auth0 owners, wrong Native clients and ambiguous signed scopes
        run: dotnet run --project tests/RemoteAuth0OwnerClaimsChecks/RemoteAuth0OwnerClaimsChecks.csproj --configuration Release
      - name: Smoke-test no-data Auth0 owner login proof remains strictly localhost-only
        run: python3 tests/SmokeAuth0OwnerSignIn.py
      - name: Validate Archer iPhone Auth0 PKCE source, Keychain boundaries and callback settings
        run: python3 tests/ValidateArcherIosAuth.py
      - name: Restore standalone encrypted backup utility
        run: dotnet restore Archer.GatewayBackup/Archer.GatewayBackup.csproj
      - name: Build standalone encrypted backup utility
        run: dotnet build Archer.GatewayBackup/Archer.GatewayBackup.csproj --configuration Release --no-restore
      - name: Validate offline-only Archer Pocket Auth0 PWA
        run: |
          python3 tests/ValidateArcherPocket.py
          node --check web/archer-pocket/app.js
          node --check web/archer-pocket/device-keys.js
          node tests/PocketDeviceKeysChecks.mjs
          node --check web/archer-pocket/sw.js
          node --check web/archer-pocket/config.js
      - name: Validate unattended CI failure triage cannot approve AI fixes
        run: |
          python3 -m py_compile tools/archer_ci_triage.py
          python3 -m unittest discover -s tests -p 'TestArcherCiTriage.py' -v
      - name: Validate safe Archer self-work patch worker (no secrets)
        run: |
          python3 -m py_compile tools/archer_self_work.py
          python3 -m unittest discover -s tests -p 'TestArcherSelfWork.py' -v
      - name: Verify local Archer installer preserves data and supports rollback
        shell: pwsh
        run: ./tests/Test-WindowsInstaller.ps1
      - name: Verify Windows package automation trusts only green main CI
        run: python3 tests/ValidateInstallerWorkflow.py
      - name: Check dashboard and presence JavaScript
        run: |
          node --check Archer.MissionControl/wwwroot/js/app.js
          node --check Archer.MissionControl/wwwroot/js/mission-voice.js
          node tests/MissionVoiceChecks.mjs
          node --check Archer.MissionControl/wwwroot/js/archer-home.js
          node --check Archer.MissionControl/wwwroot/js/realtime-voice.js
          node tests/VoiceConversationChecks.mjs
          node --check Archer.MissionControl/wwwroot/js/orb-field.js
          node --check Archer.MissionControl/wwwroot/js/developer.js
          node --check Archer.MissionControl/wwwroot/js/operator-context.js
          node --check Archer.MissionControl/wwwroot/js/spending.js
          node --check Archer.MissionControl/wwwroot/js/coding.js
          node --check Archer.MissionControl/wwwroot/js/development-batches.js
          node tests/DevelopmentWorkspaceUiChecks.mjs
          node --check Archer.MissionControl/wwwroot/js/communications.js
          node --check Archer.MissionControl/wwwroot/js/inbox.js
          node --check Archer.MissionControl/wwwroot/js/mobile-drafts.js
          node --check Archer.MissionControl/wwwroot/js/mobile-sessions.js
      - name: Validate UI element wiring
        run: python3 tests/ValidateUi.py
      - name: Smoke test local configuration and usage endpoints
        shell: bash
        run: |
          mkdir -p /tmp/archer-inbox-ci-state
          export ARCHER_DATA_DIR=/tmp/archer-inbox-ci-state
          dotnet run --no-build --configuration Release --project Archer.MissionControl/Archer.MissionControl.csproj > /tmp/archer-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5087/api/health > /tmp/archer-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/archer-smoke.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:5087/ > /tmp/archer-root.html
          curl -fsS http://127.0.0.1:5087/api/config > /tmp/archer-config.json
          # Voice mission status is local, model-free and recorded for later
          # conversational context. A third-party page must not be able to
          # forge a voice-history POST using a simple cross-origin form.
          curl -fsS -X POST -H 'Content-Type: application/json' \
            http://127.0.0.1:5087/api/voice/mission-list > /tmp/archer-local-voice-list.json
          python3 -c 'import json; x=json.load(open("/tmp/archer-local-voice-list.json")); assert x["status"]=="ok" and x["count"]==0 and "missions" in x and isinstance(x["reply"],str); print("PASS: local spoken status returns grounded reply without a model call")'
          curl -fsS http://127.0.0.1:5087/api/state > /tmp/archer-local-voice-history.json
          python3 -c 'import json; x=json.load(open("/tmp/archer-local-voice-history.json")); assert [e["role"] for e in x["conversation"]]==["user","assistant"]; assert x["conversation"][1]["content"]=="You don\x27t have any missions yet."; print("PASS: local spoken status is recorded for follow-up memory")'
          CODE=$(curl -sS -o /tmp/archer-cross-origin-voice.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://evil.example' \
            http://127.0.0.1:5087/api/voice/mission-list)
          test "$CODE" = "403"
          CODE=$(curl -sS -o /tmp/archer-form-origin-voice.json -w '%{http_code}' \
            -X POST -H 'Content-Type: text/plain' \
            http://127.0.0.1:5087/api/voice/mission-list)
          test "$CODE" = "415"
          curl -fsS http://127.0.0.1:5087/api/realtime-voice/status > /tmp/archer-realtime-status.json
          python3 -c 'import json; assert not json.load(open("/tmp/archer-realtime-status.json"))["enabled"]; print("PASS: paid realtime audio disabled by default")'
          CODE=$(curl -sS -o /tmp/archer-realtime-rejected.json -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:5087' -H 'Content-Type: application/sdp' \
            --data-binary 'v=0' -X POST http://127.0.0.1:5087/api/realtime-voice/call)
          test "$CODE" = "403"
          curl -fsS http://127.0.0.1:5087/api/usage > /tmp/archer-usage.json
          curl -fsS http://127.0.0.1:5087/api/communications > /tmp/archer-communications.json
          curl -fsS http://127.0.0.1:5087/api/mobile/capabilities > /tmp/archer-mobile.json
          curl -fsS http://127.0.0.1:5087/api/mobile/conversation-preview > /tmp/archer-mobile-drafts-off.json
          python3 -c 'import json; p=json.load(open("/tmp/archer-mobile-drafts-off.json")); assert not p["enabled"]; assert not p["connected"]; assert p["messages"]==[]; print("PASS: mobile desktop message bridge disabled by default")'
          CODE=$(curl -sS -o /tmp/archer-mobile-unauthorized.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"activity":"Working","placeLabel":"Store","durationMinutes":15,"shareWithAi":false}' \
            -X POST http://127.0.0.1:5087/api/mobile/presence)
          test "$CODE" = "403"
          CODE=$(curl -sS -o /tmp/archer-test-sms-disabled.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"confirm":false}' \
            -X POST http://127.0.0.1:5087/api/communications/test-sms)
          test "$CODE" = "400"
          curl -fsS http://127.0.0.1:5087/api/communications/preferences \
            -H 'Content-Type: application/json' \
            -d '{"dailySmsEnabled":false,"urgentCallsEnabled":false,"confirmCharges":true}' \
            -X POST > /tmp/archer-communications-saved.json
          CODE=$(curl -sS -o /tmp/archer-communications-denied.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"dailySmsEnabled":true,"urgentCallsEnabled":true,"confirmCharges":true}' \
            -X POST http://127.0.0.1:5087/api/communications/preferences)
          test "$CODE" = "400"
          python3 -c 'import json; c=json.load(open("/tmp/archer-communications.json")); m=json.load(open("/tmp/archer-mobile.json")); assert not c["providerConfigured"]; assert not c["preferences"]["dailySmsEnabled"]; assert not c["preferences"]["urgentCallsEnabled"]; assert c["attempts"]==[]; assert not m["enabled"]; assert not m["locationTracking"]; print("PASS: telephony disabled and mobile ingest blocked by default")'
          curl -fsS http://127.0.0.1:5087/api/development/code-proposals > /tmp/archer-code-proposals.json
          CODE=$(curl -sS -o /tmp/archer-draft-pr-disabled.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"confirm":true}' \
            -X POST http://127.0.0.1:5087/api/development/code-proposals/00000000-0000-0000-0000-000000000001/publish)
          test "$CODE" = "400"
          python3 -c 'import json; p=json.load(open("/tmp/archer-code-proposals.json")); assert p["proposals"]==[]; assert p["publishingEnabled"]==False; print("PASS: code publisher disabled by default and no drafts exist")'
          curl -fsS http://127.0.0.1:5087/api/spending > /tmp/archer-spend-initial.json
          curl -fsS http://127.0.0.1:5087/api/spending/settings \
            -H 'Content-Type: application/json' \
            -d '{"monthlyBudgetUsd":7,"perRequestCapUsd":0.5,"paused":true}' \
            -X POST > /tmp/archer-spend-save.json
          curl -fsS http://127.0.0.1:5087/api/spending > /tmp/archer-spend-paused.json
          CODE=$(curl -sS -o /tmp/archer-spend-invalid.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"monthlyBudgetUsd":1,"perRequestCapUsd":5,"paused":false}' \
            -X POST http://127.0.0.1:5087/api/spending/settings)
          test "$CODE" = "400"
          python3 -c 'import json; a=json.load(open("/tmp/archer-spend-initial.json")); b=json.load(open("/tmp/archer-spend-paused.json")); assert a["settings"]["monthlyBudgetUsd"]==10; assert not a["settings"]["paused"]; assert b["settings"]["monthlyBudgetUsd"]==7; assert b["settings"]["perRequestCapUsd"]==0.5; assert b["settings"]["paused"]; print("PASS: spending budget defaults, pause and validation")'
          # Reject unapproved repositories before making any GitHub API request.
          CODE=$(curl -sS -o /tmp/archer-developer-rejected.json -w '%{http_code}' \
            -G --data-urlencode 'url=https://github.com/NotAllowlisted/Repo' \
            http://127.0.0.1:5087/api/development/repository)
          test "$CODE" = "400"

          curl -fsS http://127.0.0.1:5087/api/presence > /tmp/archer-presence-off.json
          curl -fsS http://127.0.0.1:5087/api/operations > /tmp/archer-operations.json
          curl -fsS http://127.0.0.1:5087/api/briefing > /tmp/archer-briefing.json
          curl -fsS http://127.0.0.1:5087/api/briefing/preferences > /tmp/archer-briefing-preferences.json
          curl -fsS http://127.0.0.1:5087/api/briefing/preferences \
            -H 'Content-Type: application/json' \
            -d '{"timeZoneId":"America/Chicago","dailyHourLocal":9,"quietStartHourLocal":22,"quietEndHourLocal":7,"criticalOverrideQuietHours":false}' \
            -X POST > /tmp/archer-briefing-preferences-saved.json
          curl -fsS http://127.0.0.1:5087/api/briefing/preferences > /tmp/archer-briefing-preferences-after.json
          CODE=$(curl -sS -o /tmp/archer-invalid-briefing.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"timeZoneId":"America/Unknown","dailyHourLocal":99,"quietStartHourLocal":22,"quietEndHourLocal":7,"criticalOverrideQuietHours":false}' \
            -X POST http://127.0.0.1:5087/api/briefing/preferences)
          test "$CODE" = "400"
          python3 -c 'import json; b=json.load(open("/tmp/archer-briefing.json")); p=json.load(open("/tmp/archer-briefing-preferences-after.json")); assert b["deliveryStatus"]=="preview_only", b; assert "Revenue / payments / conversions: Not connected" in b["briefingText"]; assert not b["metrics"]["deliveryConnected"]; assert b["metrics"]["websites"]["enabled"]==0; assert p["preferences"]["dailyHourLocal"]==9; assert not p["deliveryEnabled"]; print("PASS: briefing metrics, unavailable revenue and preview-only policy")'
          curl -fsS http://127.0.0.1:5087/api/presence \
            -H 'Content-Type: application/json' \
            -d '{"activity":"Working","placeLabel":"Test place","durationMinutes":15,"shareWithAi":false,"latitude":29.987654,"longitude":-95.123456}' \
            -X POST > /tmp/archer-presence-save.json
          curl -fsS http://127.0.0.1:5087/api/presence > /tmp/archer-presence-set.json
          curl -fsS http://127.0.0.1:5087/api/presence -X DELETE > /tmp/archer-presence-clear.json
          curl -fsS http://127.0.0.1:5087/api/presence > /tmp/archer-presence-cleared.json
          CODE=$(curl -sS -o /tmp/archer-blocked-monitor.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Unsafe","url":"https://localhost/"}' \
            -X POST http://127.0.0.1:5087/api/operations/monitors)
          test "$CODE" = "400"
          python3 -c 'import json; p=json.load(open("/tmp/archer-presence-set.json")); clear=json.load(open("/tmp/archer-presence-cleared.json")); ops=json.load(open("/tmp/archer-operations.json")); assert p["active"]; assert p["presence"]["approxLatitude"]==29.99; assert p["presence"]["approxLongitude"]==-95.12; assert not p["presence"]["shareWithAi"]; assert not clear["active"]; assert ops["channels"]["sms"]=="Not connected"; assert ops["monitors"]==[]; print("PASS: consented coarse presence, clear and safe monitoring defaults")'
          python3 -c 'import json; c=json.load(open("/tmp/archer-config.json")); u=json.load(open("/tmp/archer-usage.json")); assert c["version"]=="1.13.0", c; assert c["routing"]["mode"]=="adaptive", c; assert u["month"]["requests"]==0, u; assert u["lifetime"]["estimatedCostUsd"]==0, u; print("PASS: Archer v1.13.0 health/config/usage endpoints")'
          python3 tests/SmokeInbox.py /tmp/archer-inbox-ci-state/archer-state.json

      - name: Smoke-test isolated gateway security and inbox
        shell: bash
        run: |
          export ARCHER_GATEWAY_ADMIN_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ARCHER_GATEWAY_INGEST_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ARCHER_GATEWAY_BRIDGE_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ARCHER_GATEWAY_DATA_KEY_HEX="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export ARCHER_GATEWAY_DATA_DIR="/tmp/archer-gateway-ci-$$"
          mkdir -p "$ARCHER_GATEWAY_DATA_DIR"
          dotnet run --no-build --configuration Release --project Archer.MobileGateway/Archer.MobileGateway.csproj > /tmp/archer-gateway-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5091/health/live > /tmp/archer-gateway-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/archer-gateway-smoke.log
            exit 1
          fi
          python3 tests/SmokeMobileGateway.py "$ARCHER_GATEWAY_DATA_DIR/mobile-gateway-state.json"
          # Restart only the isolated TEST process between synthetic suites.
          # The 90/min gateway limiter remains enabled; a new process resets
          # the prior suite's test-only throttle without waiting or bypassing it.
          # The encrypted state, device tokens and messages must survive restart.
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          dotnet run --no-build --configuration Release --project Archer.MobileGateway/Archer.MobileGateway.csproj > /tmp/archer-gateway-restarted.log 2>&1 &
          PID=$!
          GATEWAY_READY=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5091/health/live > /tmp/archer-gateway-restarted-health.json; then
              GATEWAY_READY=1
              break
            fi
            sleep 1
          done
          if [ "$GATEWAY_READY" -ne 1 ]; then
            cat /tmp/archer-gateway-restarted.log
            exit 1
          fi
          # Start the local desktop separately while gateway is still alive.
          # This verifies the two services agree on the dedicated bridge key.
          export ARCHER_GATEWAY_CHAT_BRIDGE_ENABLED=true
          export ARCHER_DATA_DIR="/tmp/archer-desktop-bridge-ci-$$"
          mkdir -p "$ARCHER_DATA_DIR"
          # Seed a synthetic desktop chat pair: NO model call or account key.
          cat > "$ARCHER_DATA_DIR/archer-state.json" <<'JSON'
          {"conversation":[{"role":"user","content":"CI_PHONE_DRAFT_READY_FOR_DESKTOP_REVIEW"},{"role":"assistant","content":"Synthetic Archer reply, manually approved in CI."}]}
          JSON
          dotnet run --no-build --configuration Release --project Archer.MissionControl/Archer.MissionControl.csproj > /tmp/archer-desktop-bridge-smoke.log 2>&1 &
          DESKTOP_PID=$!
          trap 'kill $DESKTOP_PID $PID 2>/dev/null || true' EXIT
          DESKTOP_READY=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5087/api/health > /tmp/archer-bridge-desktop-health.json; then
              DESKTOP_READY=1
              break
            fi
            sleep 1
          done
          if [ "$DESKTOP_READY" -ne 1 ]; then
            cat /tmp/archer-desktop-bridge-smoke.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:5087/api/mobile/conversation-preview > /tmp/archer-bridge-live.json
          python3 -c 'import json; p=json.load(open("/tmp/archer-bridge-live.json")); assert p["enabled"] and p["connected"], p; assert len(p["messages"])==1, p; assert p["messages"][0]["content"]=="CI_PHONE_DRAFT_READY_FOR_DESKTOP_REVIEW", p; assert p["aiRequestsMade"]==0 and p["automaticallySubmitted"]==False; print("PASS: authenticated gateway-to-desktop draft preview, no AI request or auto submit")'
          python3 tests/SmokeReplyBridge.py

      - name: Test encrypted gateway migration and tamper resistance
        shell: bash
        run: |
          python3 tests/SmokeGatewayEncryption.py

      - name: Validate cursor sync, archive and encrypted session restart
        shell: bash
        run: |
          python3 tests/SmokeGatewaySessions.py

      - name: Test offline verified encryption backup and safe restore
        shell: bash
        run: |
          python3 tests/SmokeGatewayBackups.py

  windows-voice-contract:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Windows PowerShell 5.1 speech and tray companion
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./tools/Archer-Voice.ps1).Path,
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }
          Add-Type -AssemblyName System.Speech
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Write-Host 'PASS: native Windows speech and tray companion compiles in PowerShell 5.1.'
          # CI has no trusted physical microphone: do not open the input,
          # connect to the internet, record audio, or call AI.
      - name: Exercise install/update/rollback with native voice package
        shell: powershell
        run: ./tests/Test-WindowsInstaller.ps1
