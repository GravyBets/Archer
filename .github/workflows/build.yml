name: Archer Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Archer.MissionControl/Archer.MissionControl.csproj
      - name: Build
        run: dotnet build Archer.MissionControl/Archer.MissionControl.csproj --configuration Release --no-restore
