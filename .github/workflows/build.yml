name: Archer Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Archer.MissionControl/Archer.MissionControl.csproj
      - name: Build
        run: dotnet build Archer.MissionControl/Archer.MissionControl.csproj --configuration Release --no-restore
      - name: Check dashboard and presence JavaScript
        run: |
          node --check Archer.MissionControl/wwwroot/js/app.js
          node --check Archer.MissionControl/wwwroot/js/archer-home.js
          node --check Archer.MissionControl/wwwroot/js/orb-field.js
          node --check Archer.MissionControl/wwwroot/js/developer.js
      - name: Validate UI element wiring
        run: python3 tests/ValidateUi.py
      - name: Smoke test local configuration and usage endpoints
        shell: bash
        run: |
          dotnet run --no-build --configuration Release --project Archer.MissionControl/Archer.MissionControl.csproj > /tmp/archer-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5087/api/health > /tmp/archer-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/archer-smoke.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:5087/ > /tmp/archer-root.html
          curl -fsS http://127.0.0.1:5087/api/config > /tmp/archer-config.json
          curl -fsS http://127.0.0.1:5087/api/usage > /tmp/archer-usage.json
          # Reject unapproved repositories before making any GitHub API request.
          CODE=$(curl -sS -o /tmp/archer-developer-rejected.json -w '%{http_code}' \
            -G --data-urlencode 'url=https://github.com/NotAllowlisted/Repo' \
            http://127.0.0.1:5087/api/development/repository)
          test "$CODE" = "400"
          python3 -c 'import json; c=json.load(open("/tmp/archer-config.json")); u=json.load(open("/tmp/archer-usage.json")); assert c["version"]=="0.5.1", c; assert c["routing"]["mode"]=="adaptive", c; assert u["month"]["requests"]==0, u; assert u["lifetime"]["estimatedCostUsd"]==0, u; print("PASS: Archer v0.5.1 health/config/usage endpoints")'
