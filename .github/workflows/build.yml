name: Archer Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Archer.MissionControl/Archer.MissionControl.csproj
      - name: Build
        run: dotnet build Archer.MissionControl/Archer.MissionControl.csproj --configuration Release --no-restore
      - name: Check dashboard and presence JavaScript
        run: |
          node --check Archer.MissionControl/wwwroot/js/app.js
          node --check Archer.MissionControl/wwwroot/js/archer-home.js
          node --check Archer.MissionControl/wwwroot/js/orb-field.js
          node --check Archer.MissionControl/wwwroot/js/developer.js
          node --check Archer.MissionControl/wwwroot/js/operator-context.js
          node --check Archer.MissionControl/wwwroot/js/spending.js
          node --check Archer.MissionControl/wwwroot/js/coding.js
      - name: Validate UI element wiring
        run: python3 tests/ValidateUi.py
      - name: Smoke test local configuration and usage endpoints
        shell: bash
        run: |
          dotnet run --no-build --configuration Release --project Archer.MissionControl/Archer.MissionControl.csproj > /tmp/archer-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5087/api/health > /tmp/archer-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/archer-smoke.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:5087/ > /tmp/archer-root.html
          curl -fsS http://127.0.0.1:5087/api/config > /tmp/archer-config.json
          curl -fsS http://127.0.0.1:5087/api/usage > /tmp/archer-usage.json
          curl -fsS http://127.0.0.1:5087/api/development/code-proposals > /tmp/archer-code-proposals.json
          CODE=$(curl -sS -o /tmp/archer-draft-pr-disabled.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"confirm":true}' \
            -X POST http://127.0.0.1:5087/api/development/code-proposals/00000000-0000-0000-0000-000000000001/publish)
          test "$CODE" = "400"
          python3 -c 'import json; p=json.load(open("/tmp/archer-code-proposals.json")); assert p["proposals"]==[]; assert p["publishingEnabled"]==False; print("PASS: code publisher disabled by default and no drafts exist")'
          curl -fsS http://127.0.0.1:5087/api/spending > /tmp/archer-spend-initial.json
          curl -fsS http://127.0.0.1:5087/api/spending/settings \
            -H 'Content-Type: application/json' \
            -d '{"monthlyBudgetUsd":7,"perRequestCapUsd":0.5,"paused":true}' \
            -X POST > /tmp/archer-spend-save.json
          curl -fsS http://127.0.0.1:5087/api/spending > /tmp/archer-spend-paused.json
          CODE=$(curl -sS -o /tmp/archer-spend-invalid.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"monthlyBudgetUsd":1,"perRequestCapUsd":5,"paused":false}' \
            -X POST http://127.0.0.1:5087/api/spending/settings)
          test "$CODE" = "400"
          python3 -c 'import json; a=json.load(open("/tmp/archer-spend-initial.json")); b=json.load(open("/tmp/archer-spend-paused.json")); assert a["settings"]["monthlyBudgetUsd"]==10; assert not a["settings"]["paused"]; assert b["settings"]["monthlyBudgetUsd"]==7; assert b["settings"]["perRequestCapUsd"]==0.5; assert b["settings"]["paused"]; print("PASS: spending budget defaults, pause and validation")'
          # Reject unapproved repositories before making any GitHub API request.
          CODE=$(curl -sS -o /tmp/archer-developer-rejected.json -w '%{http_code}' \
            -G --data-urlencode 'url=https://github.com/NotAllowlisted/Repo' \
            http://127.0.0.1:5087/api/development/repository)
          test "$CODE" = "400"

          curl -fsS http://127.0.0.1:5087/api/presence > /tmp/archer-presence-off.json
          curl -fsS http://127.0.0.1:5087/api/operations > /tmp/archer-operations.json
          curl -fsS http://127.0.0.1:5087/api/briefing > /tmp/archer-briefing.json
          curl -fsS http://127.0.0.1:5087/api/briefing/preferences > /tmp/archer-briefing-preferences.json
          curl -fsS http://127.0.0.1:5087/api/briefing/preferences \
            -H 'Content-Type: application/json' \
            -d '{"timeZoneId":"America/Chicago","dailyHourLocal":9,"quietStartHourLocal":22,"quietEndHourLocal":7,"criticalOverrideQuietHours":false}' \
            -X POST > /tmp/archer-briefing-preferences-saved.json
          curl -fsS http://127.0.0.1:5087/api/briefing/preferences > /tmp/archer-briefing-preferences-after.json
          CODE=$(curl -sS -o /tmp/archer-invalid-briefing.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"timeZoneId":"America/Unknown","dailyHourLocal":99,"quietStartHourLocal":22,"quietEndHourLocal":7,"criticalOverrideQuietHours":false}' \
            -X POST http://127.0.0.1:5087/api/briefing/preferences)
          test "$CODE" = "400"
          python3 -c 'import json; b=json.load(open("/tmp/archer-briefing.json")); p=json.load(open("/tmp/archer-briefing-preferences-after.json")); assert b["deliveryStatus"]=="preview_only", b; assert "Revenue / payments / conversions: Not connected" in b["briefingText"]; assert not b["metrics"]["deliveryConnected"]; assert b["metrics"]["websites"]["enabled"]==0; assert p["preferences"]["dailyHourLocal"]==9; assert not p["deliveryEnabled"]; print("PASS: briefing metrics, unavailable revenue and preview-only policy")'
          curl -fsS http://127.0.0.1:5087/api/presence \
            -H 'Content-Type: application/json' \
            -d '{"activity":"Working","placeLabel":"Test place","durationMinutes":15,"shareWithAi":false,"latitude":29.987654,"longitude":-95.123456}' \
            -X POST > /tmp/archer-presence-save.json
          curl -fsS http://127.0.0.1:5087/api/presence > /tmp/archer-presence-set.json
          curl -fsS http://127.0.0.1:5087/api/presence -X DELETE > /tmp/archer-presence-clear.json
          curl -fsS http://127.0.0.1:5087/api/presence > /tmp/archer-presence-cleared.json
          CODE=$(curl -sS -o /tmp/archer-blocked-monitor.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Unsafe","url":"https://localhost/"}' \
            -X POST http://127.0.0.1:5087/api/operations/monitors)
          test "$CODE" = "400"
          python3 -c 'import json; p=json.load(open("/tmp/archer-presence-set.json")); clear=json.load(open("/tmp/archer-presence-cleared.json")); ops=json.load(open("/tmp/archer-operations.json")); assert p["active"]; assert p["presence"]["approxLatitude"]==29.99; assert p["presence"]["approxLongitude"]==-95.12; assert not p["presence"]["shareWithAi"]; assert not clear["active"]; assert ops["channels"]["sms"]=="Not connected"; assert ops["monitors"]==[]; print("PASS: consented coarse presence, clear and safe monitoring defaults")'
          python3 -c 'import json; c=json.load(open("/tmp/archer-config.json")); u=json.load(open("/tmp/archer-usage.json")); assert c["version"]=="0.9.0", c; assert c["routing"]["mode"]=="adaptive", c; assert u["month"]["requests"]==0, u; assert u["lifetime"]["estimatedCostUsd"]==0, u; print("PASS: Archer v0.9.0 health/config/usage endpoints")'
